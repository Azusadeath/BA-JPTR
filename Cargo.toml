[workspace]
members = ["crates/bajptr-core", "crates/bajptr-cli", "crates/bajptr-desktop", "crates/bajptr-project", "crates/bajptr-launcher", "crates/bajptr-brand"]
default-members = ["crates/bajptr-core", "crates/bajptr-project", "crates/bajptr-cli", "crates/bajptr-desktop", "crates/bajptr-launcher"]
resolver = "2"

[workspace.package]
version = "0.4.2"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
crc32fast = "1"
tempfile = "3"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

