[package]
name = "bajptr-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde_json.workspace = true

[build-dependencies]
bajptr-brand = { path = "../bajptr-brand", features = ["resource"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
